<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulsemeter — Test your connection speed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1117'/%3E%3Cpath d='M16 22a9 9 0 100-18 9 9 0 000 18z' stroke='%23ffc94d' stroke-width='2' fill='none'/%3E%3Cpath d='M16 13l4 4' stroke='%23ffc94d' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="nav">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#ffc94d"/><path d="M16 22a9 9 0 100-18 9 9 0 000 18z" stroke="#161200" stroke-width="2" fill="none"/><path d="M16 13l4 4" stroke="#161200" stroke-width="2.2" stroke-linecap="round"/></svg>
      Pulsemeter
    </div>
    <span class="server">Server: Frankfurt, DE</span>
  </header>

  <main class="hero">
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 240 140" width="280" height="163">
        <path d="M20 130 A100 100 0 0 1 220 130" fill="none" stroke="#20242f" stroke-width="14" stroke-linecap="round"/>
        <path id="gaugeArc" d="M20 130 A100 100 0 0 1 220 130" fill="none" stroke="#ffc94d" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="314" stroke-dashoffset="314"/>
      </svg>
      <div class="gauge-readout">
        <span class="gauge-num" id="speedNum">0.0</span>
        <span class="gauge-unit">Mbps</span>
      </div>
    </div>

    <button class="go-btn" id="goBtn">Start test</button>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Ping</span>
        <span class="stat-val" id="pingVal">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Download</span>
        <span class="stat-val" id="downVal">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Upload</span>
        <span class="stat-val" id="upVal">—</span>
      </div>
    </div>

    <div class="meta-row">
      <div><span>ISP</span><b>Local Networks Ltd.</b></div>
      <div><span>IP address</span><b id="ipVal">—</b></div>
    </div>
  </main>

  <script src="assets/script.js"></script>
</body>
</html>
