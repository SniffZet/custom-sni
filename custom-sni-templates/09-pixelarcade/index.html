<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0221'/%3E%3Crect x='8' y='13' width='16' height='9' rx='2' fill='%2300f5d4'/%3E%3Ccircle cx='12' cy='17.5' r='1.4' fill='%230d0221'/%3E%3Ccircle cx='20' cy='17.5' r='1.4' fill='%230d0221'/%3E%3C/svg%3E">
